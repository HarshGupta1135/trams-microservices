# JetStream for durable events, TLS for transport, and per-service credentials
# scoped by subject ACLs (see the authorization block below).
# Credentials are interpolated from the environment; see .env.example.

server_name: trams-nats
listen: 0.0.0.0:4222

# HTTP monitoring endpoint (/varz, /jsz, /connz). Bound to the internal Docker
# network only; it is never published to the host in docker-compose.yml.
http: 0.0.0.0:8222

##############################################################################
# Persistence
##############################################################################
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 4GB
}

##############################################################################
# Transport security
#
# `verify: false` means the server does not demand a client certificate:
# clients authenticate with the username/password below, over an encrypted and
# server-authenticated channel. Setting `verify: true` and issuing client
# certificates upgrades this to mutual TLS, which is the natural next step in a
# cluster (see docs/ARCHITECTURE.md).
##############################################################################
tls {
  cert_file: "/etc/nats/tls/server-cert.pem"
  key_file:  "/etc/nats/tls/server-key.pem"
  ca_file:   "/etc/nats/tls/ca-cert.pem"
  verify:    false
  timeout:   5
}

##############################################################################
# Authorisation
#
# Subject-level permissions, granted per role. Note that JetStream is driven
# through request/reply on $JS.API.* subjects, so a client needs publish rights
# on the specific API subjects it uses and subscribe rights on its own inbox —
# which is precisely what lets the permissions be scoped this tightly.
##############################################################################
authorization {
  timeout: 5

  PRODUCER_PERMISSIONS = {
    publish: {
      allow: [
        # The domain events this service owns.
        "user.events.>"

        # JetStream: discover the account, and create/reconcile only the stream
        # this service owns. It cannot touch DEAD_LETTER or any other stream.
        "$JS.API.INFO"
        "$JS.API.STREAM.CREATE.USER_EVENTS"
        "$JS.API.STREAM.UPDATE.USER_EVENTS"
        "$JS.API.STREAM.INFO.USER_EVENTS"
      ]
    }
    subscribe: {
      # Replies to its own JetStream requests. No permission to subscribe to
      # user.events.>, so a compromised producer cannot read the event history.
      allow: ["_INBOX.>"]
    }
  }

  CONSUMER_PERMISSIONS = {
    publish: {
      allow: [
        # Dead letters are published, not consumed, by this service.
        "dlq.>"

        "$JS.API.INFO"

        # Owns the dead-letter stream.
        "$JS.API.STREAM.CREATE.DEAD_LETTER"
        "$JS.API.STREAM.UPDATE.DEAD_LETTER"
        "$JS.API.STREAM.INFO.DEAD_LETTER"

        # Read-only view of the stream it consumes: it may inspect USER_EVENTS
        # and manage its own durable consumer, but has no CREATE/UPDATE rights
        # on the stream itself and cannot publish a user event.
        "$JS.API.STREAM.INFO.USER_EVENTS"
        "$JS.API.CONSUMER.CREATE.USER_EVENTS.>"
        "$JS.API.CONSUMER.DURABLE.CREATE.USER_EVENTS.>"
        "$JS.API.CONSUMER.INFO.USER_EVENTS.>"
        "$JS.API.CONSUMER.MSG.NEXT.USER_EVENTS.>"

        # Acknowledgements (ack / nak / term / working).
        "$JS.ACK.USER_EVENTS.>"
      ]
    }
    subscribe: {
      allow: ["_INBOX.>"]
    }
  }

  users = [
    {
      user: $NATS_USER_SERVICE_USER
      password: $NATS_USER_SERVICE_PASSWORD
      permissions: $PRODUCER_PERMISSIONS
    }
    {
      user: $NATS_NOTIFICATION_SERVICE_USER
      password: $NATS_NOTIFICATION_SERVICE_PASSWORD
      permissions: $CONSUMER_PERMISSIONS
    }
  ]
}

##############################################################################
# Limits
##############################################################################
max_payload: 1MB
max_connections: 4096
max_control_line: 4KB
write_deadline: "10s"

# Log to stdout so the container runtime owns log collection.
debug: false
trace: false
logtime: true
