<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${subject}">Welcome</title>
</head>
<body style="margin:0;padding:0;">
<div th:replace="~{notifications/_layout :: shell('Welcome aboard', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Hello <strong th:text="${name}">there</strong>,
    </p>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Your <span th:text="${applicationName}">TRAMS</span> account has been created and is ready to use.
      We have registered it to <strong th:text="${email}">you@example.com</strong>.
    </p>
    <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#374151;">
      Created on <span th:text="${registeredAt}">today</span>.
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="border-radius:6px;background-color:#2563eb;">
          <a th:href="${appUrl}" href="#"
             style="display:inline-block;padding:11px 22px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">
            Go to your account
          </a>
        </td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
