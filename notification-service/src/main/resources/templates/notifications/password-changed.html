<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${subject}">Password changed</title>
</head>
<body style="margin:0;padding:0;">
<div th:replace="~{notifications/_layout :: shell('Your password was changed', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Hello <strong th:text="${name}">there</strong>,
    </p>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      The password on your <span th:text="${applicationName}">TRAMS</span> account was changed on
      <span th:text="${changedAt}">today</span>, from <span th:text="${requestIp}">an unknown address</span>.
    </p>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      For your security, every other signed-in session was ended.
    </p>
    <div style="margin:0;padding:12px 14px;background-color:#fef2f2;border-left:3px solid #dc2626;">
      <p style="margin:0;font-size:14px;line-height:1.6;color:#7f1d1d;">
        <strong>If this was not you</strong>, your account may be compromised. Reset your password
        immediately and contact support.
      </p>
    </div>
  </div>
</div>
</body>
</html>
