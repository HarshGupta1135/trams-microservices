<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${subject}">Profile updated</title>
</head>
<body style="margin:0;padding:0;">
<div th:replace="~{notifications/_layout :: shell('Your profile was updated', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Hello <strong th:text="${name}">there</strong>,
    </p>
    <p style="margin:0 0 10px;font-size:15px;line-height:1.6;color:#374151;">
      The following details on your account were changed:
    </p>
    <ul style="margin:0 0 16px;padding-left:20px;font-size:15px;line-height:1.7;color:#374151;">
      <li th:each="field : ${changedFields}" th:text="${field}">field</li>
    </ul>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Changed on <span th:text="${updatedAt}">today</span>.
    </p>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
      If you did not make this change, please secure your account and contact support.
    </p>
  </div>
</div>
</body>
</html>
