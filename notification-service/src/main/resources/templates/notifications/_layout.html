<!--
    Shared email shell, included by every notification template.

    Styles are inline rather than in a <style> block: most email clients strip or
    ignore stylesheets, so inline attributes are the only reliable option. The
    layout is a single centred table for the same reason - flexbox and grid are
    unsupported in several major clients.
-->
<div th:fragment="shell(heading, body)"
     style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
         style="background-color:#f4f5f7;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
               style="max-width:560px;background-color:#ffffff;border-radius:10px;border:1px solid #e3e5e8;overflow:hidden;">
          <tr>
            <td style="padding:20px 28px;background-color:#1f2937;">
              <span th:text="${applicationName}"
                    style="color:#ffffff;font-size:16px;font-weight:600;letter-spacing:0.02em;">TRAMS</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 th:text="${heading}"
                  style="margin:0 0 16px;font-size:20px;line-height:1.35;color:#111827;font-weight:600;">Heading</h1>
              <div th:replace="${body}">Body</div>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background-color:#f9fafb;border-top:1px solid #e3e5e8;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#6b7280;">
                This is an automated message from <span th:text="${applicationName}">TRAMS</span>.
                Please do not reply to it.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
