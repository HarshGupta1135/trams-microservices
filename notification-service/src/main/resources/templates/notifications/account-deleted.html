<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${subject}">Account deleted</title>
</head>
<body style="margin:0;padding:0;">
<div th:replace="~{notifications/_layout :: shell('Your account has been deleted', ~{::content})}">
  <div th:fragment="content" th:remove="tag">
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Hello <strong th:text="${name}">there</strong>,
    </p>
    <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#374151;">
      Your <span th:text="${applicationName}">TRAMS</span> account was deleted on
      <span th:text="${deletedAt}">today</span>. Access has been removed and this is the last
      message you will receive.
    </p>
    <p style="margin:0;font-size:15px;line-height:1.6;color:#374151;">
      Thank you for having used <span th:text="${applicationName}">TRAMS</span>.
    </p>
  </div>
</div>
</body>
</html>
